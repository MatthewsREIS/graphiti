apiVersion: v1
kind: Secret
metadata:
  name: {{ include "graphiti-mcp.name" . }}
  labels:
    {{- include "graphiti-mcp.labels" . | nindent 4 }}
type: Opaque
stringData:
  AWS_BEARER_TOKEN_BEDROCK: {{ required "secrets.bedrockApiKey is required" .Values.secrets.bedrockApiKey | quote }}
  NEO4J_PASSWORD: {{ required "secrets.neo4jPassword is required" .Values.secrets.neo4jPassword | quote }}
