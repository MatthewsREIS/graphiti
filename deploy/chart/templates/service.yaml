apiVersion: v1
kind: Service
metadata:
  name: {{ include "graphiti-mcp.name" . }}
  labels:
    {{- include "graphiti-mcp.labels" . | nindent 4 }}
spec:
  selector:
    {{- include "graphiti-mcp.labels" . | nindent 4 }}
  ports:
    - name: http
      port: {{ .Values.service.port }}
      targetPort: http
